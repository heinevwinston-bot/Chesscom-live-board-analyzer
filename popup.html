<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body {
      width: 220px;
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      padding: 14px;
      color: #1b1b1b;
    }
    h1 {
      font-size: 14px;
      margin: 0 0 12px;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .switch {
      position: relative;
      width: 40px;
      height: 22px;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer; inset: 0;
      background-color: #ccc; border-radius: 22px; transition: 0.2s;
    }
    .slider::before {
      content: ""; position: absolute; height: 16px; width: 16px;
      left: 3px; bottom: 3px; background: white; border-radius: 50%; transition: 0.2s;
    }
    input:checked + .slider { background-color: #1baca6; }
    input:checked + .slider::before { transform: translateX(18px); }
    label.depth-label { font-size: 12px; color: #555; }
    input[type="range"] { width: 100%; }
    .note { font-size: 11px; color: #888; margin-top: 10px; line-height: 1.4; }
  </style>
</head>
<body>
  <h1>Chess.com Stockfish Assist</h1>
  <div class="row">
    <span>Enabled</span>
    <label class="switch">
      <input type="checkbox" id="enabledToggle" />
      <span class="slider"></span>
    </label>
  </div>
  <label class="depth-label">Engine depth: <span id="depthValue">14</span></label>
  <input type="range" id="depthSlider" min="6" max="18" value="14" />
  <div class="note">
    Works on a live Chess.com game tab. Using engine assistance during rated games violates Chess.com's fair-play rules — use for analysis/practice only.
  </div>
  <script src="popup.js"></script>
</body>
</html>
